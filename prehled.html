<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bradavice – rodiče</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rodiče">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efe0">
<link rel="apple-touch-icon" href="apple-touch-icon-rodice.png">
<style>
  html, body { margin: 0; height: 100%; background: #f6efe0; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Živý přehled pro rodiče: vlastní stránka (a ikona na ploše), uvnitř běží hra v režimu ?rodic=1.
     Rodinný kód z odkazu prehled.html#kod=… se předá dál a hra si ho uloží. -->
<iframe id="f" title="Přehled pro rodiče" allow="clipboard-write"></iframe>
<script>
  document.getElementById("f").src = "index.html?rodic=1" + (location.hash || "");
  if (location.hash) try { history.replaceState(null, "", location.pathname); } catch (e) {}
</script>
</body>
</html>
